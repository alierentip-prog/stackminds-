            { t: "Solunum", q: "Perfüzyon kısıtlı gaz?", opt: ["N2O", "CO", "O2 (Hasta)", "CO2"], correct: 0, exp: "Dengeye çabuk ulaşır." },
            { t: "Solunum", q: "A-a gradyanı artarsa?", opt: ["Akciğer hastalığı", "Hipoventilasyon", "Yüksek irtifa", "Normal"], correct: 0, exp: "Gaz geçişi bozuktur." }
        ];

        let qIdx = 0; let score = 0;
        const qArea = document.getElementById('optArea');
        const qTxt = document.getElementById('qText');
        const expBox = document.getElementById('expArea');

        function loadQ() {
            const q = questions[qIdx];
            qTxt.innerHTML = (qIdx + 1) + ". " + q.q;
            document.getElementById('currQ').innerText = qIdx + 1;
            qArea.innerHTML = '';
            expBox.style.display = 'none';
            document.getElementById('nextBtn').disabled = true;

            q.opt.forEach((o, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = o;
                btn.onclick = () => check(i, btn, q);
                qArea.appendChild(btn);
            });
            if(window.MathJax) MathJax.typeset();
        }

        function check(i, btn, q) {
            const btns = qArea.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            if(i === q.correct) { btn.classList.add('correct'); score++; }
            else { btn.classList.add('wrong'); btns[q.correct].classList.add('correct'); }
            document.getElementById('expArea').innerHTML = "<strong>AÇIKLAMA:</strong> " + q.exp;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').disabled = false;
            if(window.MathJax) MathJax.typeset();
        }

        function nextQuestion() {
            if(qIdx < questions.length - 1) { qIdx++; loadQ(); }
            else {
                document.getElementById('quizContainer').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('finalScore').innerText = score + "/" + questions.length;
                let msg = score >= 160 ? "TEBRİKLER! EFSANE." : score >= 100 ? "GEÇTİN." : "KALDIN.";
                document.getElementById('finalMsg').innerText = msg;
                document.getElementById('examFooter').style.display = 'none';
            }
        }
        function prevQ() { if(qIdx > 0) { qIdx--; loadQ(); } }

        loadQ();
    </script>
