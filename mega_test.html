    <script>
        const questions = [
            // --- 1-50: ELEKTROFİZYOLOJİ ---
            { t: "Hücre", q: "Na+/K+ ATPaz pompası her döngüde ne taşır?", opt: ["3 Na dışarı, 2 K içeri", "3 Na içeri, 2 K dışarı", "2 Na dışarı, 3 K içeri", "Eşit"], correct: 0, exp: "3 Na atılır, 2 K alınır (Elektrojenik)." },
            { t: "Hücre", q: "RMP (-90 mV) oluşumunda en etkili kanal?", opt: ["Na+ voltaj", "K+ sızıntı (IK1)", "Ca++ L-tipi", "Cl-"], correct: 1, exp: "Zar dinlenmede en çok potasyuma geçirgendir." },
            { t: "Hücre", q: "Nernst denklemine göre K+ denge potansiyeli?", opt: ["+60 mV", "0 mV", "-94 mV", "-70 mV"], correct: 2, exp: "K+ için -94, Na+ için +61'dir." },
            { t: "Hücre", q: "Hücre içinde en çok bulunan anyon?", opt: ["Klor", "Bikarbonat", "Protein/Fosfat", "Sülfat"], correct: 2, exp: "Proteinler negatiftir ve hücreden çıkamazlar." },
            { t: "Hücre", q: "'Hep ya da Hiç' yasası nedir?", opt: ["Sadece güçlüler geçer", "Eşik aşılırsa AP tam genlikte olur", "Hız sabittir", "Refrakter yok"], correct: 1, exp: "Eşik geçilirse olay durdurulamaz." },
            { t: "Elektro", q: "Ventrikül Faz 0 (Vuruş) sebebi?", opt: ["Ca++ giriş", "K+ çıkış", "Hızlı Na+ giriş", "Cl-"], correct: 2, exp: "Hızlı Na kanalları açılır." },
            { t: "Elektro", q: "Plato (Faz 2) neden oluşur?", opt: ["Na+ giriş", "Ca++ giriş / K+ çıkış dengesi", "K+ çıkış", "Pompa"], correct: 1, exp: "L-Tipi Ca girişi, K çıkışını dengeler." },
            { t: "Elektro", q: "Mutlak Refrakter Dönem nedeni?", opt: ["K+ açık", "Na+ inaktivasyon kapısı kapalı", "Ca++ açık", "Cl-"], correct: 1, exp: "Na kanalları kilitlidir, açılamaz." },
            { t: "Elektro", q: "Faz 3 (Repolarizasyon) olayı?", opt: ["Na+ girer", "Ca++ girer", "K+ hızla çıkar", "Pompa"], correct: 2, exp: "K kanalları açılır, hücre negatifleşir." },
            { t: "Elektro", q: "SA Düğüm Faz 0 sebebi?", opt: ["Hızlı Na+", "L-Tipi Ca++", "K+", "Mg++"], correct: 1, exp: "SA düğümde hızlı Na kanalı yoktur, Ca ile uyarılır." },
            { t: "Elektro", q: "Pacemaker potansiyeli (Faz 4) akımı?", opt: ["IK", "ICa", "If (Funny - Na+)", "ICl"], correct: 2, exp: "Sodyum sızıntısı zarı eşiğe taşır." },
            { t: "Elektro", q: "Lidokain hangi fazı etkiler?", opt: ["Faz 0", "Faz 2", "Faz 3", "Faz 4"], correct: 0, exp: "Na kanal blokeridir." },
            { t: "Elektro", q: "Verapamil nereyi etkiler?", opt: ["Faz 0", "Faz 1", "Faz 2 (Plato)", "Faz 4"], correct: 2, exp: "Kalsiyum kanal blokeridir." },
            { t: "Elektro", q: "Amiodaron etkisi?", opt: ["Na açar", "K+ blokajı (Repolarizasyon uzar)", "Beta agonist", "Ca açar"], correct: 1, exp: "QT süresini uzatır." },
            { t: "Elektro", q: "Hiperkalemi EKG bulgusu?", opt: ["Geniş QRS", "Sivri T", "U dalgası", "ST elevasyon"], correct: 1, exp: "Repolarizasyon bozulur, T sivrileşir." },
            { t: "İleti", q: "En yavaş iletim nerede?", opt: ["Atriyum", "AV Düğüm", "His", "Purkinje"], correct: 1, exp: "0.05 m/sn. AV Delay." },
            { t: "İleti", q: "En hızlı iletim nerede?", opt: ["Atriyum", "AV Düğüm", "Ventrikül", "Purkinje"], correct: 3, exp: "4.0 m/sn. Senkron kasılma için." },
            { t: "İleti", q: "Gap Junction en az nerede?", opt: ["AV Düğüm", "SA", "Purkinje", "Ventrikül"], correct: 0, exp: "Direnç yüksek olsun diye azdır." },
            { t: "Kalsiyum", q: "Ca++ deposu neresidir?", opt: ["Mitokondri", "SR", "Çekirdek", "Lizozom"], correct: 1, exp: "Sarkoplazmik Retikulum." },
            { t: "Kalsiyum", q: "CICR nedir?", opt: ["Na girişi", "Dışarıdan giren Ca'nın depoyu boşaltması", "ATP", "K+"], correct: 1, exp: "Tetikleyici kalsiyum mekanizması." },
            { t: "Kalsiyum", q: "Gevşemede Ca++'u geri alan?", opt: ["Na/K pompa", "SERCA", "NCX", "Proton"], correct: 1, exp: "SR'a geri pompalar." },
            { t: "Kalsiyum", q: "Sempatik etki gücü nasıl artırır?", opt: ["cAMP/PKA ile Ca kanallarını fosforile ederek", "K açarak", "Na durdurarak", "Hiperpolarize"], correct: 0, exp: "Daha çok kalsiyum = Daha çok güç." },
            { t: "Yapı", q: "Kalpte T-tübül nerede?", opt: ["A-I bandı", "Z Çizgisi", "M Çizgisi", "Yok"], correct: 1, exp: "Z çizgisindedir ve geniştir." },
            { t: "İleti", q: "Overdrive Suppression?", opt: ["Yavaşın hızlıyı susturması", "Hılzının yavaşı susturması (SA patron)", "Blok", "Vagus"], correct: 1, exp: "SA çalıştığı sürece diğerleri susar." },
            { t: "İleti", q: "Atriyum-Ventrikül arası tek yol?", opt: ["Mitral", "His Demeti", "Sinüs", "Aort"], correct: 1, exp: "İskelet yalıtkandır, tek geçiş His'tir." },
            { t: "Yapı", q: "Connexin-43 nerede?", opt: ["SA", "AV", "Ventrikül", "Kapak"], correct: 2, exp: "Hızlı iletim proteinidir." },
            { t: "Yapı", q: "Fonksiyonel Sinsityum?", opt: ["Tek hücre", "Gap junction ile birleşmiş ağ", "Sinirsiz", "Kök hücre"], correct: 1, exp: "Tek birim gibi davranır." },
            { t: "İlaç", q: "Digoksin kalsiyumu nasıl artırır?", opt: ["Kanal açar", "NCX'i bozar (Na gradyanını yıkarak)", "SR sızdırır", "Mitokondri"], correct: 1, exp: "Na pompası durunca NCX çalışamaz." },
            { t: "İyon", q: "Hipokalemi RMP'yi ne yapar?", opt: ["Hiperpolarize (Negatifleşir)", "Depolarize", "Etkilemez", "Sıfırlar"], correct: 0, exp: "K+ dışarı daha çok kaçar." },
            { t: "Mekanik", q: "İzovolumetrik kasılmada ne olur?", opt: ["Hacim azalır", "Hacim sabit, Basınç artar", "Basınç sabit", "İkisi artar"], correct: 1, exp: "Kapaklar kapalıdır." },
            { t: "Ses", q: "S1 sesi (Lup)?", opt: ["Aort kapama", "Mitral/Triküspit kapama", "Dolum", "Sistol"], correct: 1, exp: "Sistol başı." },
            { t: "Mekanik", q: "Aort kapağı kaç mmHg'de açılır?", opt: ["0", "10", "80", "120"], correct: 2, exp: "Diyastolik basıncı yenince." },
            { t: "Yasa", q: "Frank-Starling (Preload artarsa)?", opt: ["SV artar", "Hız azalır", "ESV artar", "Güç azalır"], correct: 0, exp: "Gerilince sert atar." },
            { t: "PV Loop", q: "PV grafiği sağa genişlerse?", opt: ["Afterload artmış", "Preload artmış", "Kontraktilite artmış", "Yetmezlik"], correct: 1, exp: "Sağ kenar dolumu gösterir." },
            { t: "Ses", q: "S2 (Dup) ne zaman çiftleşir?", opt: ["Nefes verme", "Nefes alma (İnspirasyon)", "Ikınma", "Yatma"], correct: 1, exp: "Sağ kalp dolar, P2 gecikir." },
            { t: "Beslenme", q: "Koroner akım ne zaman?", opt: ["Sistol", "İzovolumetrik", "Diyastol", "Hep"], correct: 2, exp: "Gevşeyince." },
            { t: "Mekanik", q: "Atriyal 'Kick' (Sistol) katkısı?", opt: ["%100", "%80", "%50", "%20"], correct: 3, exp: "Dolumun çoğu pasiftir." },
            { t: "Mekanik", q: "Nabız Basıncını en çok artıran?", opt: ["Aort Darlığı", "Aort Yetmezliği", "KY", "Mitral Darlık"], correct: 1, exp: "Kaçakla diyastol düşer, fark açılır." },
            { t: "Mekanik", q: "KY'de vücut ne yapar?", opt: ["Su atar", "Su tutar (Preload artırır)", "Yavaşlar", "Gevşer"], correct: 1, exp: "Starling yasasını kullanmak ister." },
            { t: "Mekanik", q: "Dikrotik çentik?", opt: ["Aort kapanması", "Mitral açılması", "Tepe basınç", "Atriyum"], correct: 0, exp: "Kapanma dalgası." },
            { t: "Kapak", q: "Mitral darlık üfürümü?", opt: ["Sistol", "Diyastol", "Sürekli", "Duyulmaz"], correct: 1, exp: "Kan dolarken öter." },
            { t: "Kapak", q: "Aort darlık basınç farkı?", opt: ["Eşit", "Ventrikül > Aort", "Aort > Ventrikül", "Sıfır"], correct: 1, exp: "Ventrikül çok zorlanır." },
            { t: "Venöz", q: "Juguler 'a' dalgası?", opt: ["Atriyal sistol", "Ventrikül sistol", "Dolum", "Kapanma"], correct: 0, exp: "Atriyum kasılması." },
            { t: "Hacim", q: "ESV (End-Sistolik) artarsa?", opt: ["Güç artmış", "Güç azalmış (Yetmezlik)", "Hız artmış", "Afterload azalmış"], correct: 1, exp: "Kalp boşaltamıyor." },
            { t: "EKG", q: "Normal PR süresi?", opt: ["0.04-0.10", "0.12-0.20", "0.20-0.40", "0.44+"], correct: 1, exp: "5 küçük karedir." },
            { t: "EKG", q: "Geniş QRS (>0.12) anlamı?", opt: ["Atriyal büyüme", "Dal Bloğu / Ventriküler", "Hızlı iletim", "Erken"], correct: 1, exp: "Yavaş kas iletimi." },
            { t: "EKG", q: "V1'de rSR' (Tavşan)?", opt: ["Sol Blok", "Sağ Dal Bloğu", "1. Derece", "Sol Ön"], correct: 1, exp: "Sağ taraf geç uyarılır." },
            { t: "EKG", q: "AFib özelliği?", opt: ["Testere", "P yok, düzensiz", "Geniş QRS", "Sabit PR"], correct: 1, exp: "Titreşim." },
            { t: "EKG", q: "STEMI bulgusu?", opt: ["Q dalgası", "ST Elevasyonu", "Negatif T", "PR çökme"], correct: 1, exp: "Hasar akımı." },
            { t: "EKG", q: "Hiperkalemi T dalgası?", opt: ["U", "Sivri/Yüksek", "Çökük", "Geniş"], correct: 1, exp: "Çadır T." },
              { t: "EKG", q: "2. Derece AV Blok Tip 1 (Wenckebach) özelliği?", opt: ["PR sabit", "PR uzar, QRS düşer", "PR kısalır", "P yok"], correct: 1, exp: "Yorulan AV düğüm." },
            { t: "EKG", q: "2. Derece AV Blok Tip 2 özelliği?", opt: ["PR sabit, QRS aniden düşer", "PR uzar", "QRS geniş", "Zararsız"], correct: 0, exp: "His demeti hasarı, pil gerekir." },
            { t: "EKG", q: "3. Derece (Tam) Blok?", opt: ["PR uzun", "P ve QRS bağımsız", "Sadece P var", "Hızlı iletim"], correct: 1, exp: "AV disosiasyon." },
            { t: "EKG", q: "aVR derivasyonu normalde?", opt: ["Pozitif", "Negatif", "Düz", "Değişken"], correct: 1, exp: "Sağ omuza bakar, elektrik uzaklaşır." },
            { t: "EKG", q: "LBBB (Sol Dal Blok) V6 bulgusu?", opt: ["Derin S", "Çentikli R (M)", "Q", "Sivri T"], correct: 1, exp: "WiLLiaM." },
            { t: "EKG", q: "RBBB (Sağ Dal Blok) V1 bulgusu?", opt: ["rSR' (Tavşan)", "Derin Q", "M şeklinde", "Yok"], correct: 0, exp: "MaRoW." },
            { t: "EKG", q: "Sinüs Aritmisi nedir?", opt: ["Solunumla hız değişimi", "Patolojik", "Blok", "Fibrilasyon"], correct: 0, exp: "Nefes alınca hızlanır, verince yavaşlar. Normaldir." },
            { t: "EKG", q: "Wolf-Parkinson-White (WPW) üçlüsü?", opt: ["Kısa PR, Delta, Geniş QRS", "Uzun PR, Delta", "Kısa QT", "Blok"], correct: 0, exp: "Kent demeti erken uyarır." },
            { t: "EKG", q: "İskemi (Enfarktüs değil) bulgusu?", opt: ["ST elevasyon", "Simetrik T negatifliği", "Q dalgası", "U dalgası"], correct: 1, exp: "Beslenme bozukluğu." },
            { t: "EKG", q: "Torsades de Pointes tedavisi?", opt: ["Kalsiyum", "Magnezyum", "Sodyum", "Potasyum"], correct: 1, exp: "Magnezyum sülfat." },
            
            // --- DOLAŞIM FİZYOLOJİSİ (AKIM, DİRENÇ, BASINÇ) ---
            { t: "Dolaşım", q: "Direnci en çok etkileyen faktör?", opt: ["Uzunluk", "Viskozite", "Yarıçap", "Basınç"], correct: 2, exp: "Poiseuille: r üzeri 4." },

                ]; // SORU LİSTESİNİ KAPATAN PARANTEZ (BUNUN OLDUĞUNDAN EMİN OL)

        // --- SINAV MOTORU (ÇALIŞTIRAN KOD) ---
        let qIdx = 0; 
        let score = 0;
        
        // Elementleri Seç
        const qArea = document.getElementById('optArea');
        const qTxt = document.getElementById('qText');
        const expArea = document.getElementById('expArea');
        const nextBtn = document.getElementById('nextBtn');
        const currQSpan = document.getElementById('currQ');
        const quizContainer = document.getElementById('quizContainer');
        const resultScreen = document.getElementById('resultScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const finalMsg = document.getElementById('finalMsg');
        const examFooter = document.getElementById('examFooter');

        // Soruyu Yükle
        function loadQ() {
            const q = questions[qIdx];
            qTxt.innerHTML = (qIdx + 1) + ". " + q.q;
            currQSpan.innerText = qIdx + 1;
            
            // Alanı Temizle
            qArea.innerHTML = '';
            expArea.style.display = 'none';
            nextBtn.disabled = true;      // BUTONU KİLİTLE
            nextBtn.style.opacity = "0.5"; // GRİ GÖRÜNSÜN

            // Şıkları Oluştur
            q.opt.forEach((o, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = o;
                btn.onclick = () => check(i, btn, q); // Tıklayınca kontrol et
                qArea.appendChild(btn);
            });

            // Matematik sembollerini işle
            if(window.MathJax) MathJax.typeset();
        }

        // Cevap Kontrolü
        function check(i, btn, q) {
            // Tüm şıkları kilitle (Bir daha basamasın)
            const allBtns = qArea.querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            // Doğru mu Yanlış mı?
            if(i === q.correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                // Doğru olanı da göster
                allBtns[q.correct].classList.add('correct');
            }
            
            // Açıklamayı Göster
            expArea.innerHTML = "<strong>AÇIKLAMA:</strong> " + q.exp;
            expArea.style.display = 'block';

            // BUTON KİLİDİNİ AÇ!
            nextBtn.disabled = false;
            nextBtn.style.opacity = "1";
            nextBtn.style.cursor = "pointer";

            if(window.MathJax) MathJax.typeset();
        }

        // Sonraki Soruya Geç
        function nextQ() {
            if(qIdx < questions.length - 1) {
                qIdx++;
                loadQ();
            } else {
                finishExam();
            }
        }

        // Önceki Soru (İsteğe bağlı)
        function prevQ() {
            if(qIdx > 0) {
                qIdx--;
                loadQ();
            }
        }

        // Sınavı Bitir
        function finishExam() {
            quizContainer.style.display = 'none';
            examFooter.style.display = 'none';
            document.querySelector('.exam-header').style.display = 'none';
            
            resultScreen.style.display = 'block';
            finalScoreDisplay.innerText = score;
            
            // Mesaj
            let ratio = (score / questions.length) * 100;
            if(ratio > 80) finalMsg.innerText = "TEBRİKLER! DERECE YAPARSIN.";
            else if(ratio > 50) finalMsg.innerText = "GEÇTİN. AMA TEKRAR LAZIM.";
            else finalMsg.innerText = "KALDIN. ÇALIŞMAYA DEVAM.";
        }

        // SİSTEMİ BAŞLAT
        loadQ();

    </script>
