<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ünite Testi | Kardiyak Elektrofizyoloji</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --paper: #f8fafc; --ink: #0f172a; --blue-ink: #0369a1; --correct: #059669; --wrong: #dc2626; }
        body { margin: 0; background-color: var(--paper); color: var(--ink); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: #1e293b; color: #e2e8f0; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #334155; }
        .brand { font-weight: bold; font-size: 1.2rem; color: white; text-decoration: none; margin-bottom: 40px; }
        .menu-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; color: #94a3b8; text-decoration: none; transition: 0.2s; }
        .menu-item:hover { background: #334155; color: white; }
        .menu-item.active { background: var(--blue-ink); color: white; font-weight: bold; }

        .quiz-area { flex: 1; padding: 20px 40px; overflow-y: auto; max-width: 900px; margin: 0 auto; }
        .quiz-header { border-bottom: 2px solid #cbd5e1; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .score-badge { background: #e0f2fe; color: var(--blue-ink); padding: 8px 16px; border-radius: 20px; font-weight: bold; }

        .question-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; animation: fadeIn 0.4s ease; }
        .q-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; line-height: 1.6; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn { padding: 15px 20px; border: 2px solid #e2e8f0; background: white; border-radius: 10px; cursor: pointer; text-align: left; font-size: 1rem; transition: all 0.2s; position: relative; }
        .option-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
        
        .option-btn.correct { border-color: var(--correct); background: #ecfdf5; color: var(--correct); font-weight: bold; }
        .option-btn.wrong { border-color: var(--wrong); background: #fef2f2; color: var(--wrong); opacity: 0.7; }

        .explanation-box { margin-top: 25px; padding: 20px; background: #f8fafc; border-left: 5px solid var(--blue-ink); border-radius: 4px; display: none; }
        .btn-nav { background: var(--ink); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .result-screen { text-align: center; display: none; padding-top: 50px; }
        .final-score { font-size: 4rem; font-weight: 900; color: var(--blue-ink); }
        
        @media (max-width: 768px) { 
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; height: auto; flex-direction: row; padding: 15px; justify-content: space-between; }
            .brand { margin: 0; } .menu-item { display: none; } 
            .quiz-area { padding: 20px; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="index.html" class="brand"><i class="fa-solid fa-chevron-left"></i> Ana Menü</a>
        <a href="elektro.html" class="menu-item"><i class="fa-solid fa-book-open"></i> Konu 1</a>
        <a href="elektro2.html" class="menu-item"><i class="fa-solid fa-bolt"></i> Konu 2</a>
        <a href="elektro3.html" class="menu-item"><i class="fa-solid fa-network-wired"></i> Konu 3</a>
        <a href="#" class="menu-item active"><i class="fa-solid fa-pencil"></i> Ünite Testi</a>
    </nav>

    <main class="quiz-area">
        <div class="quiz-header" id="quizHeader">
            <div><h2 style="margin:0;">Kardiyovasküler Sınavı</h2><small>Bölüm: Elektrofizyoloji</small></div>
            <div class="score-badge">Soru: <span id="currentQ">1</span> / <span id="totalQ">50</span></div>
        </div>

        <div id="quizContainer">
            <div class="question-card">
                <div class="q-text" id="questionText">Yükleniyor...</div>
                <div class="options-grid" id="optionsArea"></div>
                <div class="explanation-box" id="expBox"><span style="font-weight:bold; display:block; color:#64748b;">AÇIKLAMA:</span><span id="expText"></span></div>
            </div>
            <div style="display:flex; justify-content:flex-end;">
                <button class="btn-nav" id="nextBtn" onclick="nextQuestion()" disabled>Sonraki &rarr;</button>
            </div>
        </div>

        <div class="result-screen" id="resultScreen">
            <h1>Sınav Tamamlandı!</h1>
            <div class="final-score" id="finalScoreDisplay">0</div>
            <p id="finalMessage" style="font-size:1.2rem; margin-top:20px;"></p>
            <button class="btn-nav" onclick="location.reload()">Tekrar Dene ↻</button>
        </div>
    </main>

    <script>
        const questions = [
            { q: "Ventrikül kas hücresinde RMP'nin -90 mV olmasının ana nedeni nedir?", opt: ["Na+/K+ pompası", "Zarın K+ geçirgenliğinin yüksek olması", "Anyonlar", "Na+ sızıntısı"], correct: 1, exp: "Dinlenme halinde K+ sızıntı kanalları açıktır, K+ dışarı kaçar ve içeriyi negatif yapar." },
            { q: "Plato (Faz 2) evresinden sorumlu iyon dengesi hangisidir?", opt: ["Na+ giriş / K+ çıkış", "Ca++ giriş / K+ çıkış", "Ca++ çıkış / Na+ giriş", "Cl- giriş"], correct: 1, exp: "L-Tipi Ca++ girişi, K+ çıkışını dengeler." },
            { q: "İletim hızı EN YÜKSEK olan doku hangisidir?", opt: ["Atriyum", "AV Düğüm", "Purkinje", "Ventrikül"], correct: 2, exp: "Purkinje lifleri 4 m/sn ile en hızlıdır." },
            { q: "Mutlak Refrakter Dönemde güçlü uyarı verilirse ne olur?", opt: ["Zayıf AP oluşur", "Güçlü AP oluşur", "AP oluşmaz", "Fibrilasyon olur"], correct: 2, exp: "Na+ kanalları inaktiftir, kapı kilitlidir." },
            { q: "SA Düğümde Faz 4 spontan depolarizasyonundan sorumlu akım?", opt: ["INa", "If (Funny)", "ICa-L", "IK"], correct: 1, exp: "Funny akımı (If) sodyum sızıntısı yaparak zarı eşiğe taşır." },
            { q: "CICR (Kalsiyumun Tetiklediği Kalsiyum Salınımı) mekanizmasında tetiği çeken nedir?", opt: ["Na+ girişi", "Hücre dışından giren Ca++", "ATP", "K+"], correct: 1, exp: "Dışarıdan giren az miktarda Ca++, depodaki (SR) çok miktarda Ca++'u serbest bırakır." },
            { q: "Norepinefrin kalp hızını nasıl artırır?", opt: ["K+ kanallarını açarak", "cAMP artışı ile If ve Ca++ kanallarını uyararak", "Asetilkolini bloke ederek", "Pompaları durdurarak"], correct: 1, exp: "Beta-1 uyarısı cAMP'yi artırır, bu da kanalları fosforile eder." },
            { q: "Hiperkalemi (Yüksek K+) kalbi nasıl etkiler?", opt: ["Hiperpolarize eder", "Kısmen depolarize eder ama iletimi yavaşlatır", "Değişmez", "AP süresi uzar"], correct: 1, exp: "Dışarıda K+ artarsa içerideki K+ çıkamaz. Zar potansiyeli yükselir (-90'dan -70'e) ama Na+ kanalları çalışmaz hale gelir." },
            { q: "Digoksinin etki mekanizması nedir?", opt: ["Ca++ kanalı açar", "Beta agonist", "Na+/K+ ATPaz'ı inhibe eder", "RyR blokeri"], correct: 2, exp: "Na+ pompası durursa içeride Ca++ birikir, kasılma artar." },
            { q: "AV Delay (Gecikme) neden olur?", opt: ["Hücre uzunluğu", "Miyelin kılıf", "Gap junction azlığı", "Na kanal çokluğu"], correct: 2, exp: "Gap junction az olduğu için direnç yüksektir." },
            { q: "Inward Rectifier K+ (IK1) kanalları ne zaman en aktiftir?", opt: ["Faz 0", "Faz 2", "Faz 3", "Faz 4"], correct: 3, exp: "Dinlenme (Faz 4) potansiyelini koruyan kanallardır." },
            { q: "T-tübüllerin konumu nasıldır?", opt: ["A-I bandında", "Z çizgisinde", "Sadece atriyumda", "Yoktur"], correct: 1, exp: "Kalpte Z çizgisinde, iskelet kasında A-I bandındadır." },
            { q: "Lidokain hangi fazı etkiler?", opt: ["Faz 0", "Faz 2", "Faz 3", "Faz 4"], correct: 0, exp: "Hızlı Na+ kanallarını bloke eder." },
            { q: "Asetilkolin kalbi nasıl yavaşlatır?", opt: ["Na+ alarak", "K+ çıkışını artırıp hiperpolarize ederek", "Ca++ alarak", "Cl- ile"], correct: 1, exp: "K+ kanallarını açar, hücre içini daha negatif (-100mV) yapar." },
            { q: "Frank-Starling yasasının temeli nedir?", opt: ["Ca++ miktarı", "Aktin-Miyozin örtüşme optimizasyonu", "ATP", "Na+"], correct: 1, exp: "Lifler gerildikçe mekanik avantaj artar." },
            { q: "Overdrive Suppression nedir?", opt: ["Hızlı odakların yavaşları susturması", "AV blok", "Kasılma artışı", "Koroner akım"], correct: 0, exp: "SA düğüm hızlı çalıştığı sürece diğerleri susar." },
            { q: "Sol atriyuma hızlı iletimi sağlayan yol?", opt: ["Arka yol", "Orta yol", "Bachmann demeti", "His"], correct: 2, exp: "Bachmann demeti atriyumlar arası köprüdür." },
            { q: "Vagus neden ventrikül kasılmasını az etkiler?", opt: ["Reseptör yok", "İnervasyon az", "ACh yıkılır", "Kanal yok"], correct: 1, exp: "Vagus ventriküllere çok az lif gönderir." },
            { q: "Kalsequestrin'in görevi nedir?", opt: ["Ca++ depolamak", "Ca++ pompalamak", "Kasmak", "Gevşetmek"], correct: 0, exp: "SR içinde kalsiyumu bağlar." },
            { q: "Kalp hızlanınca QT süresi ne olur?", opt: ["Uzar", "Kısalır", "Değişmez", "Önce uzar sonra kısalır"], correct: 1, exp: "Diyastol kısaldığı için sistol de hızlanmalıdır." },
            { q: "Kalsiyum Rijiditesi (Taş Kalp) nedir?", opt: ["Na blokajı", "Aşırı hücre içi Ca++ yüzünden gevşeyememe", "K+ kaybı", "ATP bitişi"], correct: 1, exp: "Çok fazla kalsiyum kalbi kasılı halde durdurur." },
            { q: "Hangi kanal açılırsa hiperpolarizasyon olur?", opt: ["Na+", "Ca++", "K+", "Cl- (içerde azsa)"], correct: 2, exp: "K+ dışarı çıkar, içersi negatifleşir." },
            { q: "WPW sendromunda Delta dalgası neden olur?", opt: ["Blok", "Aksesuar yoldan erken uyarılma", "Hasar", "Durma"], correct: 1, exp: "Kent demeti AV düğümü bypass eder." },
            { q: "Gap Junction proteininin adı nedir?", opt: ["İntegrin", "Koneksin", "Kaderin", "Okludin"], correct: 1, exp: "6 Koneksin birleşir." },
            { q: "NCX (Na/Ca değiştirici) nasıl çalışır?", opt: ["3 Na dışarı 1 Ca içeri", "3 Na içeri 1 Ca dışarı", "1'e 1", "ATP ile"], correct: 1, exp: "Sodyumun içeri girme gücünü kullanır." },
            { q: "Atropin nabzı neden artırır?", opt: ["Beta uyarısı", "Muskarinik blokaj", "Na kanal açar", "Adrenalin"], correct: 1, exp: "Vagus frenini kaldırır." },
            { q: "Stokes-Adams sendromu nedir?", opt: ["SA durması", "AV blok sonrası ventrikül uyanana kadar bayılma", "VF", "Taşikardi"], correct: 1, exp: "Beyne kan gitmeyen o kısa süre." },
            { q: "Fonksiyonel Sinsityum ne demektir?", opt: ["Sitoplazma birleşik", "Elektriksel olarak bütün", "Tek çekirdek", "Sinirsiz"], correct: 1, exp: "Gap junctionlar sayesinde tek hücre gibi davranır." },
            { q: "QT aralığı neyi gösterir?", opt: ["Atriyal sistol", "Ventriküler sistol (Elk.)", "Mekanik sistol", "İletim"], correct: 1, exp: "Depolarizasyon + Repolarizasyon." },
            { q: "Bainbridge refleksi nedir?", opt: ["Tansiyon artışı", "Atriyum gerilince hızın artması", "Oksijen", "Ağrı"], correct: 1, exp: "Venöz dönüş artınca kalp hızlanır." },
            { q: "Kalp neden anaerobik çalışamaz?", opt: ["Glikojen az", "Mitokondri az", "Enzim yok", "Yağ yakamaz"], correct: 0, exp: "Oksijene bağımlıdır, stoğu yoktur." },
            { q: "Kronotropik etki ne demektir?", opt: ["Hız", "Güç", "İletim", "Gevşeme"], correct: 0, exp: "Zamanla ilgili (Hız)." },
            { q: "Re-entry için ne gerekmez?", opt: ["Tek yönlü blok", "Uzun yol", "Yavaş iletim", "Hızlı iletim"], correct: 3, exp: "Hızlı iletim re-entry'i bozar." },
            { q: "P dalgası yok, düzensiz QRS?", opt: ["Sinüs taşikardisi", "Atriyal Fibrilasyon", "Blok", "RBBB"], correct: 1, exp: "Atriyumlar titreşiyor." },
            { q: "Digoksin EKG bulgusu?", opt: ["ST elevasyonu", "Çanak ST depresyonu", "Sivri T", "Geniş QRS"], correct: 1, exp: "Salvador Dali bıyığı." },
            { q: "T-tübül içinde ne vardır?", opt: ["Sitoplazma", "SR sıvısı", "Hücre dışı sıvı", "Lenf"], correct: 2, exp: "Zarın devamıdır." },
            { q: "S2 sesi ne zaman duyulur?", opt: ["Sistol başı", "İzovolumetrik gevşeme başı", "Sistol ortası", "Diyastol sonu"], correct: 1, exp: "Aort kapağı kapandığında." },
            { q: "Valsalva manevrasında debi ne olur?", opt: ["Artar", "Azalır", "Değişmez", "Artar sonra azalır"], correct: 1, exp: "Dönüş azalır." },
            { q: "Normal EF kaçtır?", opt: ["%20", "%40", "%60", "%100"], correct: 2, exp: "%55-70 arası normaldir." },
            { q: "Uzun QT neye yol açar?", opt: ["Flutter", "Torsades de Pointes", "Bradikardi", "Blok"], correct: 1, exp: "Ölümcül VT." },
            { q: "Baroreseptörler nerede?", opt: ["Ventrikül", "Karotid/Aort", "Vena cava", "Akciğer"], correct: 1, exp: "Basınç ölçerler." },
            { q: "Kalbin ana yakıtı?", opt: ["Glukoz", "Laktat", "Yağ Asidi", "Protein"], correct: 2, exp: "%60-70 yağ yakar." },
            { q: "Bezold-Jarisch refleksi?", opt: ["Hipertansiyon", "Hipotansiyon/Bradikardi", "Sadece HT", "Sadece Hız"], correct: 1, exp: "Vagal deşarj." },
            { q: "Gap junction'ı kapatan iyon?", opt: ["Mg", "Na", "Ca++ ve H+", "K"], correct: 2, exp: "Hücre ölürken komşusunu korumak için kapanır." },
            { q: "Preload artarsa güç artar?", opt: ["Laplace", "Frank-Starling", "Poiseuille", "Ohm"], correct: 1, exp: "Lastik gibi gerilince sert atar." },
            { q: "Afterload'u belirleyen?", opt: ["Dönüş", "Aort Basıncı", "Hız", "Hacim"], correct: 1, exp: "Önündeki duvar." },
            { q: "Koroner akım ne zaman olur?", opt: ["Sistol", "Sistol sonu", "Diyastol", "Hep"], correct: 2, exp: "Gevşeyince damarlar açılır." },
            { q: "Adrenalin ikincil habercisi?", opt: ["cGMP", "IP3", "cAMP", "Ca"], correct: 2, exp: "Gs proteini -> cAMP." },
            { q: "Connexin-40 nerede?", opt: ["Ventrikül", "Atriyum/Purkinje", "SA", "Kapak"], correct: 1, exp: "Hızlı iletim yerlerinde." },
            { q: "P dalgası ekseni?", opt: ["Sağ-Yukarı", "Sol-Aşağı", "Sol", "Sağ"], correct: 1, exp: "SA'dan Apexe doğru." }
        ];

        let qIdx = 0; let score = 0;
        const qArea = document.getElementById('optionsArea');
        const qTxt = document.getElementById('questionText');
        const expBox = document.getElementById('expBox');

        function loadQ() {
            const q = questions[qIdx];
            qTxt.innerHTML = (qIdx+1) + ". " + q.q;
            qArea.innerHTML = '';
            expBox.style.display = 'none';
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('currentQ').innerText = qIdx+1;

            q.opt.forEach((o, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = o;
                btn.onclick = () => check(i, btn, q);
                qArea.appendChild(btn);
            });
            if(window.MathJax) MathJax.typeset();
        }

        function check(i, btn, q) {
            const btns = qArea.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            if(i === q.correct) { btn.classList.add('correct'); score++; }
            else { btn.classList.add('wrong'); btns[q.correct].classList.add('correct'); }
            
            document.getElementById('expText').innerHTML = q.exp;
            expBox.style.display = 'block';
            document.getElementById('nextBtn').disabled = false;
            if(window.MathJax) MathJax.typeset();
        }

        function nextQuestion() {
            if(qIdx < questions.length - 1) { qIdx++; loadQ(); }
            else {
                document.getElementById('quizContainer').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('finalScoreDisplay').innerText = score + " / 50";
                let msg = score >= 40 ? "Tebrikler Doktor!" : score >= 25 ? "İdare eder." : "Kaldın. Tekrar çalış.";
                document.getElementById('finalMessage').innerText = msg;
            }
        }
        loadQ();
    </script>
</body>
</html>
